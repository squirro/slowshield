name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  ZIZMOR_VERSION: "1.30.1"

jobs:
  # The website has its own workflow (website.yml). When every changed file is under website/, the jobs
  # below are skipped and only `CI passed` reports; manual runs and pushes without a known base run all.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # diff the pushed or proposed commits
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Anything outside website/?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            if [ -n "$changed" ] && ! grep -qv '^website/' <<<"$changed"; then code=false; fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Changes outside website/: ${code}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint, types & workflow audit
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lockfile references public PyPI only
        run: |
          if grep -nE 'https?://' uv.lock | grep -vE 'https://(pypi\.org|files\.pythonhosted\.org)/'; then
            echo "uv.lock references a non-public index; re-lock with: UV_INDEX_URL= uv lock --default-index https://pypi.org/simple"
            exit 1
          fi

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Audit workflows (zizmor, pedantic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor==${ZIZMOR_VERSION}" --persona=pedantic --format=github .github/

      - name: Check observability configs and dashboards
        run: uv run python observability/check.py

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm charts
        run: |
          for chart in deploy/helm/slowshield deploy/helm/slowshield-observability; do
            helm lint --strict "$chart"
            helm template smoke "$chart" > /dev/null
          done

  test:
    name: Tests (${{ matrix.arch }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.15 and dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage.xml
          retention-days: 14

  images:
    name: Images, e2e & perf (${{ matrix.arch }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read # check out the repository (and main for the perf baseline)
      pull-requests: read # read the pull request's labels (skip-perf)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
        run: |
          for image in slowshield caddy fakeupstream; do
            tag="slowshield-${image}:ci"
            [ "$image" = slowshield ] && tag="slowshield:ci"
            docker buildx build \
              --platform "linux/${ARCH}" \
              --file "containers/${image}/Dockerfile" \
              --build-arg "SLOWSHIELD_VERSION=0.0.0-ci" \
              --build-arg "SLOWSHIELD_GIT_SHA=${GIT_SHA}" \
              --cache-from "type=gha,scope=${image}-${ARCH}" \
              --cache-to "type=gha,scope=${image}-${ARCH},mode=max" \
              --tag "$tag" --load .
          done
          docker image ls --filter reference='slowshield*'

      - name: Container hardening smoke test
        run: |
          docker volume create ci-data
          docker run -d --name ci --read-only --tmpfs /tmp:size=64m,noexec \
            --cap-drop ALL --security-opt no-new-privileges -v ci-data:/data -p 127.0.0.1:18081:8080 slowshield:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18081/readyz && break; sleep 1; done
          test "$(docker inspect --format '{{.Config.User}}' slowshield:ci)" = "65532:65532"
          if docker exec ci /bin/sh -c true 2>/dev/null; then echo "image must not contain a shell"; exit 1; fi
          docker rm -f ci

      - name: End-to-end tests
        env:
          E2E: "1"
          SLOWSHIELD_IMAGE: slowshield:ci
          SLOWSHIELD_CADDY_IMAGE: slowshield-caddy:ci
          FAKEUPSTREAM_IMAGE: slowshield-fakeupstream:ci
        run: uv run pytest -m e2e tests/e2e -v

      # The performance comparison runs on every pull request unless it has the skip-perf label. The label is
      # read live rather than from the event, so adding it and re-running the job is enough.
      - name: Performance comparison wanted?
        id: perf
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx skip-perf; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip-perf label: no performance comparison or micro benchmarks"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install k6
        if: steps.perf.outputs.run == 'true'
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Check out the base branch (perf baseline)
        if: steps.perf.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          persist-credentials: false

      - name: Build baseline image
        id: baseline
        if: steps.perf.outputs.run == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -f .baseline/containers/slowshield/Dockerfile ]; then
            docker buildx build --platform "linux/${ARCH}" --file .baseline/containers/slowshield/Dockerfile \
              --cache-from "type=gha,scope=slowshield-${ARCH}" --tag slowshield:baseline --load .baseline
            echo "image=slowshield:baseline" >> "$GITHUB_OUTPUT"
          fi

      - name: Performance comparison against the base branch (informational)
        if: steps.perf.outputs.run == 'true'
        continue-on-error: true
        env:
          PERF_BASELINE: ${{ steps.baseline.outputs.image }}
        run: |
          baseline_args=()
          if [ -n "${PERF_BASELINE}" ]; then baseline_args=(--baseline "$PERF_BASELINE"); fi
          uv run python -m perf run --candidate slowshield:ci "${baseline_args[@]}" \
            --fakeupstream slowshield-fakeupstream:ci --profile quick --rounds 3 --duration 10s \
            --out "perf/results/pr"

      - name: Micro benchmarks
        if: github.event_name != 'pull_request' || steps.perf.outputs.run == 'true'
        run: uv run python -m perf micro --repeat 5 --out perf/results/micro.json

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ matrix.arch }}
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30

  # The one required status check on main. A skipped matrix job reports under its unexpanded name
  # ("Tests (${{ matrix.arch }})"), so requiring the jobs themselves would block website-only changes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, test, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed, or was skipped for a website-only change
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "changes outside website/: ${CODE:-unknown}; job results: ${RESULTS}"
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) [ "$CODE" = false ] || { echo "a job was skipped although code changed"; exit 1; } ;;
              *) echo "a job ended with: ${result}"; exit 1 ;;
            esac
          done
