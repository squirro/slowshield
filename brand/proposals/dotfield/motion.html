<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlowShield motion study: Dot Field</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--m-bg)}:root{--m-bg:#f3ecdf;--m-line:#e3d8c5;--m-field:#1d44c4;--m-fast:#1c1914;--m-slow:#1c1914;--m-halo:#f3ecdf;--m-ripple:#fffaf2}@media (prefers-color-scheme: dark){:root{--m-bg:#15130f;--m-line:#35302a;--m-field:#86a0ff;--m-fast:#f1eadc;--m-slow:#f1eadc;--m-halo:#15130f;--m-ripple:#1f1c17}}
.ms{--ms-size:1;position:relative;width:320px;height:180px;overflow:hidden;border-radius:14px;background:var(--m-bg);
  border:1px solid var(--m-line);flex:none}
.ms svg.stage-bg{position:absolute;inset:0;width:320px;height:180px}
.ms .streak{position:absolute;left:-46px;top:-1.5px;width:46px;height:3px;border-radius:2px;transform-origin:100% 50%;
  background:linear-gradient(90deg,transparent,var(--m-fast));opacity:0}
.ms .flash{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,var(--m-field) 0,transparent 70%)}
.ms .slow{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--m-slow);box-shadow:0 0 0 3px var(--m-halo),0 0 18px var(--m-slow)}
.ms .trail{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--m-slow);opacity:.4}
@media (prefers-reduced-motion: reduce){.ms *{animation:none!important}}
@keyframes ms-dotfield-s0{0%{transform:translate(-10px,12px) rotate(10.58deg);opacity:0}3%{opacity:1}22%{transform:translate(172px,46px) rotate(10.58deg);opacity:1}22.01%{transform:translate(172px,46px) rotate(169.42deg)}38%{transform:translate(63.87px,66.2px) rotate(169.42deg);opacity:0}100%{transform:translate(63.87px,66.2px) rotate(169.42deg);opacity:0}}.ms-dotfield .s0{animation:ms-dotfield-s0 2.8s linear 0s infinite;transform:translate(134.15px,53.07px) rotate(169.42deg);opacity:1}@keyframes ms-dotfield-r0{0%,21.5%{transform:scale(.01);opacity:0}23%{opacity:.85}75%,100%{transform:scale(1);opacity:0}}.ms-dotfield .r0{transform-box:fill-box;transform-origin:center;transform:scale(.45);opacity:.6;animation:ms-dotfield-r0 2.8s cubic-bezier(.2,.6,.3,1) 0s infinite}@keyframes ms-dotfield-s1{0%{transform:translate(-10px,156px) rotate(-15.95deg);opacity:0}3%{opacity:1}22%{transform:translate(172px,104px) rotate(-15.95deg);opacity:1}22.01%{transform:translate(172px,104px) rotate(-164.05deg)}38%{transform:translate(66.23px,73.78px) rotate(-164.05deg);opacity:0}100%{transform:translate(66.23px,73.78px) rotate(-164.05deg);opacity:0}}.ms-dotfield .s1{animation:ms-dotfield-s1 2.8s linear 1.4s infinite;transform:translate(134.98px,93.42px) rotate(-164.05deg);opacity:0}@keyframes ms-dotfield-r1{0%,21.5%{transform:scale(.01);opacity:0}23%{opacity:.85}75%,100%{transform:scale(1);opacity:0}}.ms-dotfield .r1{transform-box:fill-box;transform-origin:center;transform:scale(.01);opacity:0;animation:ms-dotfield-r1 2.8s cubic-bezier(.2,.6,.3,1) 1.4s infinite}@keyframes ms-dotfield-slow{0%{transform:translate(-20px,128px);opacity:0}6%{opacity:1}62%{transform:translate(245.2px,102px)}90%{transform:translate(245.2px,102px);opacity:1}100%{transform:translate(245.2px,102px);opacity:0}}.ms-dotfield .slow{width:12px;height:12px;margin:-6px 0 0 -6px;animation:ms-dotfield-slow 11s cubic-bezier(.45,.05,.55,.95) infinite;transform:translate(245.2px,102px)}</style></head><body><div class="ms ms-dotfield" role="img" aria-label="Fast streaks deflect off the field; a slow dot passes through"><svg class="stage-bg" viewBox="0 0 320 180" aria-hidden="true"><defs><pattern id="ms-dotfield-p" patternUnits="userSpaceOnUse" x="227.2" y="12" width="12" height="12"><circle cx="6" cy="6" r="3.6" style="fill:var(--m-field)"/></pattern><mask id="ms-dotfield-m" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="180"><rect width="320" height="180" fill="#fff"/><circle class="rp r0" cx="176" cy="46" r="80" fill="none" stroke="#000" stroke-width="14"/><circle class="rp r1" cx="176" cy="104" r="80" fill="none" stroke="#000" stroke-width="14"/></mask></defs><path d="M233.2 18.4 L290.4 36.6 V86 C290.4 125 267 151 233.2 164 C199.4 151 176 125 176 86 V36.6 Z" fill="url(#ms-dotfield-p)" mask="url(#ms-dotfield-m)"/></svg><i class="streak s0"></i><i class="streak s1"></i><i class="slow"></i></div></body></html>
