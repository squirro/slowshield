#6b6252">$ npm install axios@1.14.1</text><rect x="560" y="541" rx="16" width="290" height="35" fill="#ebd1c6"/><text x="574" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#b8292b">deflected · HTTP 451</text><text x="866" y="566" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6b6252">MAL-2026-2307</text></svg>
