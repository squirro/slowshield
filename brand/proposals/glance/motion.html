<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlowShield motion study: Glance</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--m-bg)}:root{--m-bg:#f2f4fb;--m-line:#dce1f0;--m-field:#2a4bff;--m-fast:#0a0f24;--m-slow:#2a4bff;--m-halo:#f2f4fb;--m-ripple:#ffffff}@media (prefers-color-scheme: dark){:root{--m-bg:#060915;--m-line:#1f2742;--m-field:#7f95ff;--m-fast:#e6eafb;--m-slow:#b9c6ff;--m-halo:#060915;--m-ripple:#0d1222}}
