<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="SlowShield social preview"><defs><radialGradient id="ua-glow" cx="0.2" cy="0.4" r="0.6"><stop offset="0" style="stop-color:#7f95ff;stop-opacity:0.22"/><stop offset="1" style="stop-color:#7f95ff;stop-opacity:0"/></radialGradient></defs><rect width="1280" height="640" fill="#060915"/><rect width="1280" height="640" fill="url(#ua-glow)"/><path d="M64 452 H1216" stroke="#1f2742" stroke-width="2"/><g transform="translate(92 70) scale(4.9)"><defs><linearGradient id="ua-zone" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="42" y2="0"><stop offset="0" style="stop-color:#7f95ff;stop-opacity:0.3"/><stop offset="1" style="stop-color:#7f95ff;stop-opacity:0"/></linearGradient></defs><circle cx="40" cy="32" r="22" fill="url(#ua-zone)"/><path d="M26.46 14.66 A22 22 0 0 0 26.46 49.34" fill="none" stroke="#7f95ff" stroke-width="4.6" stroke-linecap="round"/><defs><linearGradient id="ua-in" gradientUnits="userSpaceOnUse" x1="2" y1="6" x2="16.62" y2="22.08"><stop offset="0" style="stop-color:#e6eafb;stop-opacity:0.0"/><stop offset="1" style="stop-color:#e6eafb;stop-opacity:1.0"/></linearGradient></defs><path d="M2 6 L16.62 22.08" fill="none" stroke="url(#ua-in)" stroke-width="3.2" stroke-linecap="round"/><defs><linearGradient id="ua-out" gradientUnits="userSpaceOnUse" x1="16.62" y1="22.08" x2="3.63" y2="22.46"><stop offset="0" style="stop-color:#e6eafb;stop-opacity:0.75"/><stop offset="1" style="stop-color:#e6eafb;stop-opacity:0.0"/></linearGradient></defs><path d="M16.62 22.08 L3.63 22.46" fill="none" stroke="url(#ua-out)" stroke-width="2.2" stroke-linecap="round"/><circle cx="14.2" cy="43.6" r="1.5" fill="#7f95ff" opacity=".35"/><circle cx="24.4" cy="41.8" r="2.2" fill="#7f95ff" opacity=".6"/><circle cx="33.8" cy="39.6" r="4.8" fill="#7f95ff"/></g><text x="476" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="100" letter-spacing="-0.5" text-anchor="start"><tspan fill="#e6eafb" font-weight="500">Slow</tspan><tspan fill="#7f95ff" font-weight="750">Shield</tspan></text><text x="480" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="650" fill="#7f95ff">Deflect, don't obstruct.</text><text x="480" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#e6eafb" opacity=".86">Supply-chain defence proxy for PyPI and npm.</text><text x="480" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#e6eafb" opacity=".86">New releases wait 7 days. Malware is turned away.</text><text x="104" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#98a2c4">$ pip install granian</text><rect x="560" y="487" rx="16" width="369.2" height="35" fill="#2a2948"/><text x="574" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#a99bff">held · unlocks in 5 d 14 h</text><text x="945.2" y="512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#98a2c4">2.8.4 waits; 2.8.3 is served</text><text x="104" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#98a2c4">$ npm install axios@1.14.1</text><rect x="560" y="541" rx="16" width="290" height="35" fill="#3d1f2c"/><text x="574" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#ff6f7e">deflected · HTTP 451</text><text x="866" y="566" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#98a2c4">MAL-2026-2307</text></svg>
