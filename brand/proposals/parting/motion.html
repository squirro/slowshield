<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlowShield motion study: Parting</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--m-bg)}:root{--m-bg:#f4f4f6;--m-line:#e1e1e7;--m-field:#e45ba6;--m-fast:#16171b;--m-slow:#16171b;--m-halo:#f4f4f6;--m-ripple:#ffffff}@media (prefers-color-scheme: dark){:root{--m-bg:#101114;--m-line:#2a2c34;--m-field:#ff8fc4;--m-fast:#ececf2;--m-slow:#ececf2;--m-halo:#101114;--m-ripple:#191a1f}}
.ms{--ms-size:1;position:relative;width:320px;height:180px;overflow:hidden;border-radius:14px;background:var(--m-bg);
  border:1px solid var(--m-line);flex:none}
.ms svg.stage-bg{position:absolute;inset:0;width:320px;height:180px}
.ms .streak{position:absolute;left:-46px;top:-1.5px;width:46px;height:3px;border-radius:2px;transform-origin:100% 50%;
  background:linear-gradient(90deg,transparent,var(--m-fast));opacity:0}
.ms .flash{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,var(--m-field) 0,transparent 70%)}
.ms .slow{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--m-slow);box-shadow:0 0 0 3px var(--m-halo),0 0 18px var(--m-slow)}
.ms .trail{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--m-slow);opacity:.4}
@media (prefers-reduced-motion: reduce){.ms *{animation:none!important}}

67.09deg);opacity:0}.ms-parting .f1{left:147px;top:132px;animation:ms-parting-f1 2.6s linear 1.3s infinite}</style></head><body><div class="ms ms-parting" role="img" aria-label="Fast streaks deflect off the field; a slow dot passes through"><svg class="stage-bg" viewBox="0 0 320 180" aria-hidden="true"><defs><linearGradient id="ms-parting-g" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="240" y2="180"><stop offset="0.00" style="stop-color:#6a3ff2"/><stop offset="0.33" style="stop-color:#a84ee6"/><stop offset="0.67" style="stop-color:#e45ba6"/><stop offset="1.00" style="stop-color:#ff8f8a"/></linearGradient><mask id="ms-parting-m" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="180"><rect width="320" height="180" fill="#fff"/><ellipse class="gap" cx="0" cy="0" rx="13" ry="22" fill="#000"/></mask></defs><g class="curtain" mask="url(#ms-parting-m)" fill="none" stroke="url(#ms-parting-g)" stroke-width="3" stroke-linecap="round"><path d="M150 6 V174"/><path d="M166 6 V174"/><path d="M182 6 V174"/><path d="M198 6 V174"/><path d="M214 6 V174"/><path d="M230 6 V174"/></g></svg><i class="streak s0"></i><i class="flash f0"></i><i class="streak s1"></i><i class="flash f1"></i><i class="slow"></i></div></body></html>
