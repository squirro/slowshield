<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="SlowShield social preview"><defs><radialGradient id="ua-glow" cx="0.2" cy="0.4" r="0.6"><stop offset="0" style="stop-color:#ac95ff;stop-opacity:0.22"/><stop offset="1" style="stop-color:#ac95ff;stop-opacity:0"/></radialGradient></defs><rect width="1280" height="640" fill="#101114"/><rect width="1280" height="640" fill="url(#ua-glow)"/><path d="M64 452 H1216" stroke="#2a2c34" stroke-width="2"/><g transform="translate(92 70) scale(4.9)"><defs><clipPath id="ua-clip"><path d="M32 4 L54 11 V30 C54 45 45 55 32 60 C19 55 10 45 10 30 V11 Z"/></clipPath><linearGradient id="ua-sh" gradientUnits="userSpaceOnUse" x1="10" y1="6" x2="54" y2="58"><stop offset="0.00" style="stop-color:#6a3ff2"/><stop offset="0.33" style="stop-color:#a84ee6"/><stop offset="0.67" style="stop-color:#e45ba6"/><stop offset="1.00" style="stop-color:#ff8f8a"/></linearGradient></defs><g clip-path="url(#ua-clip)" fill="none" stroke="url(#ua-sh)" stroke-width="3.8" stroke-linecap="round"><path d="M2 13 H20 C25 13 26 10 32 10 C38 10 39 13 44 13 H62"/><path d="M2 22 H18 C24 22 25 16 32 16 C39 16 40 22 46 22 H62"/><path d="M2 31 H23.4"/><path d="M40.6 31 H62"/><path d="M2 40 H18 C24 40 25 46 32 46 C39 46 40 40 46 40 H62"/><path d="M2 49 H20 C25 49 26 52 32 52 C38 52 39 49 44 49 H62"/></g><circle cx="32" cy="31" r="5.3" fill="#ececf2"/></g><text x="476" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="100" letter-spacing="0.4" text-anchor="start"><tspan fill="#a0a2ad" font-weight="400">slow</tspan><tspan fill="#ececf2" font-weight="650">shield</tspan></text><text x="480" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="650" fill="#ac95ff">Deflect, don't obstruct.</text><text x="480" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#ececf2" opacity=".86">Supply-chain defence proxy for PyPI and npm.</text><text x="480" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#ececf2" opacity=".86">New releases wait 7 days. Malware is turned away.</text><text x="104" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#a0a2ad">$ pip install granian</text><rect x="560" y="487" rx="16" width="369.2" height="35" fill="#273648"/><text x="574" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#79b7ff">held · unlocks in 5 d 14 h</text><text x="945.2" y="512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a0a2ad">2.8.4 waits; 2.8.3 is served</text><text x="104" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#a0a2ad">$ npm install axios@1.14.1</text><rect x="560" y="541" rx="16" width="290" height="35" fill="#45282c"/><text x="574" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#ff7882">deflected · HTTP 451</text><text x="866" y="566" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a0a2ad">MAL-2026-2307</text></svg>
