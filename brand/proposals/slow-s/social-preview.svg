<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="SlowShield social preview"><defs><radialGradient id="ua-glow" cx="0.2" cy="0.4" r="0.6"><stop offset="0" style="stop-color:#ff4fa6;stop-opacity:0.22"/><stop offset="1" style="stop-color:#ff4fa6;stop-opacity:0"/></radialGradient></defs><rect width="1280" height="640" fill="#090909"/><rect width="1280" height="640" fill="url(#ua-glow)"/><path d="M64 452 H1216" stroke="#262626" stroke-width="2"/><g transform="translate(92 70) scale(4.9)"><defs><mask id="ua-m" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="32" r="8.4" fill="#000"/></mask></defs><path d="M47 15.5 C44 10 38.5 7.5 32 7.5 C23.5 7.5 17 12 17 19.5 C17 27 23.5 29.5 32 32 C40.5 34.5 47.5 37 47.5 44.5 C47.5 52 41 56.5 32 56.5 C25 56.5 19.5 54 16.5 48.5" fill="none" stroke="#f5f5f5" stroke-width="7.4" stroke-linecap="round" mask="url(#ua-m)"/><circle cx="32" cy="32" r="4.7" fill="#ff4fa6"/><defs><linearGradient id="ua-in" gradientUnits="userSpaceOnUse" x1="63.5" y1="2.6" x2="44.6" y2="3.7"><stop offset="0" style="stop-color:#f5f5f5;stop-opacity:0.0"/><stop offset="1" style="stop-color:#f5f5f5;stop-opacity:1.0"/></linearGradient></defs><path d="M63.5 2.6 L44.6 3.7" fill="none" stroke="url(#ua-in)" stroke-width="2.8" stroke-linecap="round"/><defs><linearGradient id="ua-out" gradientUnits="userSpaceOnUse" x1="44.6" y1="3.7" x2="42.26" y2="0.6"><stop offset="0" style="stop-color:#f5f5f5;stop-opacity:0.7"/><stop offset="1" style="stop-color:#f5f5f5;stop-opacity:0.0"/></linearGradient></defs><path d="M44.6 3.7 L42.26 0.6" fill="none" stroke="url(#ua-out)" stroke-width="2" stroke-linecap="round"/></g><text x="476" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="100" letter-spacing="-1" font-weight="800" text-anchor="start"><tspan fill="#f5f5f5">slowshield</tspan><tspan fill="#ff4fa6">.</tspan></text><text x="480" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="650" fill="#ff4fa6">Deflect, don't obstruct.</text><text x="480" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#f5f5f5" opacity=".86">Supply-chain defence proxy for PyPI and npm.</text><text x="480" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#f5f5f5" opacity=".86">New releases wait 7 days. Malware is turned away.</text><text x="104" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#a3a3a3">$ pip install granian</text><rect x="560" y="487" rx="16" width="369.2" height="35" fill="#26293f"/><text x="574" y="512" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#8f99ff">held · unlocks in 5 d 14 h</text><text x="945.2" y="512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a3a3a3">2.8.4 waits; 2.8.3 is served</text><text x="104" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#a3a3a3">$ npm install axios@1.14.1</text><rect x="560" y="541" rx="16" width="290" height="35" fill="#3f1f1f"/><text x="574" y="566" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#ff6e6e">deflected · HTTP 451</text><text x="866" y="566" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a3a3a3">MAL-2026-2307</text></svg>
