# Loki single binary, filesystem storage, 15 day retention, native OTLP ingestion at /otlp.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 360h
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000
  otlp_config:
    resource_attributes:
      attributes_config:
        # service.name/namespace/instance.id are index labels by default; keep the version searchable too.
        - action: structured_metadata
          attributes: [service.version, slowshield.worker]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

analytics:
  reporting_enabled: false
