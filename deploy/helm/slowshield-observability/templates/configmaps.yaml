{{- /* Configs copied from observability/ into files/ by observability/sync.py. */ -}}
{{- range $component := list "alloy" "prometheus" "loki" "tempo" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obs.componentName" (list $ $component) }}
  labels: {{- include "obs.labels" (list $ $component) | nindent 4 }}
data:
  {{- include "obs.filesConfig" (list $ $component) | nindent 2 }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obs.componentName" (list . "grafana-provisioning") }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
data:
  {{- include "obs.filesConfig" (list . "grafana/provisioning") | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obs.componentName" (list . "grafana-dashboards") }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
data:
  {{- (.Files.Glob "files/grafana/dashboards/*.json").AsConfig | nindent 2 }}
