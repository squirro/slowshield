{{- $c := .Values.grafana }}
{{- $name := include "obs.componentName" (list . "grafana") }}
{{- $alerting := include "obs.alertingSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "obs.selectorLabels" (list . "grafana") | nindent 6 }}
  template:
    # Dashboards are re-read from their ConfigMap every minute; provisioning changes need a restart.
    metadata: {{- include "obs.podMetadata" (list . "grafana" (include "obs.filesConfig" (list . "grafana/provisioning"))) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "obs.fullname" . }}
      automountServiceAccountToken: false
      {{- include "obs.podCommon" (list . "grafana") | nindent 6 }}
      securityContext: {{- include "obs.podSecurityContext" (list . $c) | nindent 8 }}
      containers:
        - name: grafana
          image: {{ include "obs.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          securityContext: {{- include "obs.securityContext" . | nindent 12 }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ $c.admin.user | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /run/secrets/grafana-admin/password
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: strict
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/slowshield-overview.json
            {{- with $c.rootUrl }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: GF_LOG_MODE
              value: console
            - name: GF_LOG_LEVEL
              value: warn
            # Referenced by provisioning/alerting/contactpoints.yaml.
            - name: SLOWSHIELD_ALERT_WEBHOOK_URL
              {{- if $alerting }}
              valueFrom:
                secretKeyRef:
                  name: {{ $alerting }}
                  key: {{ .Values.alerting.existingSecretKey }}
              {{- else }}
              value: http://127.0.0.1:9/disabled
              {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          resources: {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: admin
              mountPath: /run/secrets/grafana-admin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "obs.dataVolume" (list . "grafana") | nindent 8 }}
        - name: provisioning
          configMap:
            name: {{ include "obs.componentName" (list . "grafana-provisioning") }}
            items:
              {{- range $path, $_ := .Files.Glob "files/grafana/provisioning/**" }}
              - key: {{ base $path }}
                path: {{ trimPrefix "files/grafana/provisioning/" $path }}
              {{- end }}
        - name: dashboards
          configMap:
            name: {{ include "obs.componentName" (list . "grafana-dashboards") }}
        - name: admin
          secret:
            secretName: {{ include "obs.grafanaAdminSecret" . }}
            defaultMode: 0400
            items:
              - key: {{ $c.admin.passwordKey }}
                path: password
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  selector: {{- include "obs.selectorLabels" (list . "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
