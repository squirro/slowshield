{{- $c := .Values.prometheus }}
{{- $name := include "obs.componentName" (list . "prometheus") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" (list . "prometheus") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "obs.selectorLabels" (list . "prometheus") | nindent 6 }}
  template:
    metadata: {{- include "obs.podMetadata" (list . "prometheus" (include "obs.filesConfig" (list . "prometheus"))) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "obs.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- include "obs.podCommon" (list . "prometheus") | nindent 6 }}
      securityContext: {{- include "obs.podSecurityContext" (list . $c) | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ include "obs.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $c.retention }}
            {{- with $c.retentionSize }}
            - --storage.tsdb.retention.size={{ . }}
            {{- end }}
            - --web.enable-otlp-receiver
            - --web.enable-remote-write-receiver
          securityContext: {{- include "obs.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            failureThreshold: 4
          resources: {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- include "obs.dataVolume" (list . "prometheus") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" (list . "prometheus") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "obs.selectorLabels" (list . "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
