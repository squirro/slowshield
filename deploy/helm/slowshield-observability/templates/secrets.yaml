{{- if not .Values.grafana.admin.existingSecret }}
{{- $name := include "obs.grafanaAdminSecret" . }}
{{- $key := .Values.grafana.admin.passwordKey }}
{{- $password := randAlphaNum 32 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (default dict .data) $key }}
{{- $password = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
type: Opaque
data:
  # Generated on install and kept across upgrades.
  {{ $key }}: {{ $password }}
---
{{- end }}
{{- if and .Values.alerting.webhookUrl (not .Values.alerting.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obs.alertingSecret" . }}
  labels: {{- include "obs.labels" (list . "grafana") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.alerting.existingSecretKey }}: {{ .Values.alerting.webhookUrl | quote }}
{{- end }}
