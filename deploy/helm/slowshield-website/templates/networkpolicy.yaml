{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "website.fullname" . }}
  labels: {{- include "website.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "website.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - { port: 8080, protocol: TCP }
  # A static site needs no egress at all.
  egress: []
{{- end }}
