# Installing the chart with Flux straight from a release tag (the chart isn't published to a chart registry). The
# image tag defaults to the chart's appVersion, so moving the tag moves the whole deployment.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: slowshield
  namespace: slowshield
spec:
  interval: 1h
  url: https://github.com/squirro/slowshield
  ref:
    tag: v0.0.11
  ignore: |
    /*
    !/deploy/helm/slowshield/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slowshield
  namespace: slowshield
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/slowshield
      sourceRef:
        kind: GitRepository
        name: slowshield
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    hostnames:
      - slowshield.example.com
