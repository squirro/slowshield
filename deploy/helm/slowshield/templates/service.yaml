apiVersion: v1
kind: Service
metadata:
  name: {{ include "slowshield.fullname" . }}
  labels: {{- include "slowshield.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector: {{- include "slowshield.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.caddy.enabled }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
    {{- if .Values.service.http3 }}
    - name: https-quic
      port: {{ .Values.service.httpsPort }}
      targetPort: https-quic
      protocol: UDP
    {{- end }}
    {{- else }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- end }}
