# SlowShield Helm chart values.
#
# One replica only: SlowShield keeps its state (SQLite database + verified artifact cache) on a
# ReadWriteOnce volume and runs a single writer, so the Deployment uses the Recreate strategy and
# there is no PodDisruptionBudget (a PDB with minAvailable=1 on a single replica would only block
# node drains). Scale vertically (workers/resources) instead.

image:
  repository: ghcr.io/squirro/slowshield
  # Defaults to the chart's appVersion.
  tag: ""
  # Optional immutable digest (sha256:...); takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
#  - name: harbor-pull

# Hostnames clients use. With caddy.enabled these become Caddy's site addresses (TLS certificates).
hostnames:
  - slowshield.example.com

# Externally visible base URL (client setup snippets, npm tarball URLs).
# Defaults to https://<first hostname>.
publicUrl: ""

# PyPI is served at /pypi/simple/, npm at /npm/, Go modules at /go/, Maven at /maven/ and Cargo at /cargo/ on every
# hostname above.
# ecosystems.*.hostnames (per-ecosystem host routing) are deprecated and removed in 0.1: leave them empty.
ecosystems:
  pypi:
    enabled: true
    hostnames: []
  npm:
    enabled: true
    hostnames: []
  go:
    enabled: true
  maven:
    enabled: true
  cargo:
    enabled: true

# Granian workers (processes; threads on the free-threaded build).
workers: 2

# config.toml for SlowShield (hot-reloaded; environment variables set by this chart take precedence).
config: |
  default_delay_days = 7
  enforce_age_on_download = true
  fail_open = true
  metadata_cache_ttl_hours = 6
  record_client_ip = true
  client_ip_retention_days = 30
  event_retention_days = 365

  [upstreams.pypi]
  mirrors = ["https://pypi.org"]

  [upstreams.npm]
  mirrors = ["https://registry.npmjs.org"]

  [cache]
  artifacts_enabled = true
  artifacts_max_gb = 20
  metadata_max_mb = 1024
  metadata_memory_mb = 64

  [feeds]
  poll_interval_minutes = 60

  [feeds.osv]
  enabled = true

  [feeds.github_advisory]
  enabled = true

  # [[exceptions]]
  # ecosystem = "pypi"
  # package = "litellm"
  # delay_days = 14
  # note = "supply chain incident 2026-03"

feeds:
  github:
    # Either give the token here (a Secret is created) or reference an existing Secret.
    # Without a token the GitHub Advisory feed stays off; the UI explains how to enable it.
    token: ""
    existingSecret: ""
    existingSecretKey: token

tls:
  # internal: Caddy's own CA (clients must trust its root; see NOTES)
  # acme:     ACME (Let's Encrypt by default); hostnames must resolve to the Service and 80/443 be reachable
  # files:    an existing kubernetes.io/tls Secret (e.g. issued by cert-manager or an internal CA)
  mode: internal
  acme:
    email: ""
    ca: https://acme-v02.api.letsencrypt.org/directory
  existingSecret: ""
  # "1.3" (default) or "1.2" for legacy clients (ECDHE + AEAD suites only).
  minVersion: "1.3"
  hsts: "max-age=63072000; includeSubDomains"

caddy:
  enabled: true
  image:
    repository: ghcr.io/squirro/slowshield-caddy
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Prometheus metrics on the pod-internal port 9180 (container port name "caddy-metrics").
  metrics: false
  # JSON access logs to a file in addition to stdout (for file-tailing collectors).
  accessLogFile: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# OpenTelemetry (traces, metrics, logs via OTLP/HTTP), e.g. an in-cluster Alloy:
#   otlpEndpoint: http://alloy.observability.svc.cluster.local:4318
telemetry:
  otlpEndpoint: ""
  traceSampleRatio: "0.1"
  resourceAttributes: ""

persistence:
  data:
    size: 25Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
    existingClaim: ""
  # Caddy certificates / ACME account / internal CA (keep them across restarts: ACME rate limits).
  caddy:
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
    existingClaim: ""

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 1Gi }

service:
  # LoadBalancer exposes Caddy directly (TCP 80/443 + UDP 443 for HTTP/3).
  # With caddy.enabled=false use ClusterIP behind your own Ingress/Gateway.
  type: ClusterIP
  annotations: {}
  # Local preserves client source IPs (recorded on security events).
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: []
  httpPort: 80
  httpsPort: 443
  http3: true

networkPolicy:
  enabled: true
  # Extra peers allowed to reach Caddy (default: anyone). Example: only an ingress namespace.
  ingressFrom: []
  # Peers allowed to scrape caddy-metrics (9180) when caddy.metrics=true.
  metricsFrom:
    - namespaceSelector: {}
  # OTLP collector port to allow egress to (in-cluster), when telemetry.otlpEndpoint is set.
  otlpPort: 4318

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 45

# Pod Security Standard "restricted".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
