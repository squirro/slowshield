# Drop-in for deploy/podman/quadlet/slowshield-caddy.container: metrics listener, OTLP traces, JSON
# access log on the shared slowshield-caddy-logs volume (tailed by Alloy).
[Container]
Environment=CADDY_METRICS=on
Environment=CADDY_TRACING=on
Environment=CADDY_ACCESS_LOG_FILE=on
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
Environment=OTEL_EXPORTER_OTLP_PROTOCOL=grpc
Environment=OTEL_SERVICE_NAME=caddy
Environment=OTEL_TRACES_SAMPLER=parentbased_traceidratio
Environment=OTEL_TRACES_SAMPLER_ARG=0.1
