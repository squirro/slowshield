# Drop-in for deploy/podman/quadlet/slowshield.container: ship metrics, logs and traces to Alloy.
[Container]
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
Environment=OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
Environment=OTEL_SERVICE_NAME=slowshield
Environment=OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=podman
Environment=SLOWSHIELD_TRACE_SAMPLE_RATIO=0.1

[Unit]
Wants=slowshield-alloy.service
After=slowshield-alloy.service
