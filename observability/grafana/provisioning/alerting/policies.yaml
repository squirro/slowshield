# Notification policy tree for the stack's Grafana (replaces the default policy of org 1).
apiVersion: 1

policies:
  - orgId: 1
    receiver: slowshield-default
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Security alerts: notify immediately and keep reminding hourly.
      - receiver: slowshield-default
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
