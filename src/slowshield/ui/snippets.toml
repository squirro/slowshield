# Client setup snippets, one source for the Setup page (/ui/setup) and slowshield.org (website/build.py).
# Placeholders: {pypi} PyPI index URL, {npm} npm registry URL, {go} Go module proxy URL, {py_pkg} example Python
# package, {age_days} the release age pip, uv and npm enforce themselves (the second layer: the Setup page can
# leave those lines out, see snippets.without_client_age).
# tests/e2e/test_snippets.py runs every snippet below in bash, zsh and fish containers against the e2e stack.

# Global setup: pip, uv, npm and go use SlowShield in every new terminal, and pip and npm also refuse releases
# younger than {age_days} days themselves (pip 26.1, npm 11.10 or later). Not uv: it records exclude-newer in uv.lock,
# so a value that differs between machines breaks `uv sync --locked`; it goes in pyproject.toml (Per tool). GOPROXY
# has no `,direct`: with it, the go command fetches from the origin whenever the proxy says 404. `os` preselects the tab
# (macOS defaults to zsh); the visitor's last choice wins.
[[shell]]
id = "bash"
label = "bash (Linux)"
os = "linux"
code = """
cat >> ~/.bashrc <<'EOF'
export PIP_INDEX_URL={pypi}
export UV_DEFAULT_INDEX={pypi}
export npm_config_registry={npm}
export GOPROXY={go}
export PIP_UPLOADED_PRIOR_TO=P{age_days}D
export npm_config_min_release_age={age_days}
EOF
source ~/.bashrc"""

# macOS Terminal opens login shells, which read ~/.bash_profile, not ~/.bashrc.
[[shell]]
id = "bash-macos"
label = "bash (macOS)"
os = ""
code = """
cat >> ~/.bash_profile <<'EOF'
export PIP_INDEX_URL={pypi}
export UV_DEFAULT_INDEX={pypi}
export npm_config_registry={npm}
export GOPROXY={go}
export PIP_UPLOADED_PRIOR_TO=P{age_days}D
export npm_config_min_release_age={age_days}
EOF
source ~/.bash_profile"""

[[shell]]
id = "zsh"
label = "zsh"
os = "mac"
code = """
cat >> ~/.zshrc <<'EOF'
export PIP_INDEX_URL={pypi}
export UV_DEFAULT_INDEX={pypi}
export npm_config_registry={npm}
export GOPROXY={go}
export PIP_UPLOADED_PRIOR_TO=P{age_days}D
export npm_config_min_release_age={age_days}
EOF
source ~/.zshrc"""

[[shell]]
id = "fish"
label = "fish"
os = ""
code = """
set -Ux PIP_INDEX_URL {pypi}
set -Ux UV_DEFAULT_INDEX {pypi}
set -Ux npm_config_registry {npm}
set -Ux GOPROXY {go}
set -Ux PIP_UPLOADED_PRIOR_TO P{age_days}D
set -Ux npm_config_min_release_age {age_days}"""

# One install through SlowShield, in a throwaway virtualenv: Homebrew and current Linux Pythons refuse pip
# installs outside one (PEP 668).
[try]
python = """
python3 -m venv /tmp/slowshield-try
/tmp/slowshield-try/bin/pip install --index-url {pypi} {py_pkg}"""
